name: Produktfeed aktualisieren

on:
  schedule:
    # täglich um 05:00 UTC (= 07:00 in Berlin im Sommer, 06:00 im Winter)
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Feed laden und mappen
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
        run: node scripts/fetch-feed.mjs

      - name: Änderungen committen (falls vorhanden)
        run: |
          git config user.name "pc-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.generated.json
          git diff --staged --quiet || git commit -m "Produktdaten aktualisiert"
          git push
